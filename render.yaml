databases:
  - name: vietfood-db
    region: frankfurt
    plan: basic-256mb
services:
  - type: web
    name: vietfood-web
    runtime: docker
    region: frankfurt
    plan: starter
    preDeployCommand: npm run db:migrate && npm run db:init && npm run demo:bootstrap
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: vietfood-db, property: connectionString}
      - key: APP_ENV
        value: demo
      - key: APP_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SECURE
        value: "false"
      - key: OPENCAGE_API_KEY
        sync: false
      - key: TRUST_PROXY
        value: render
  - type: worker
    name: vietfood-worker
    runtime: docker
    region: frankfurt
    plan: starter
    dockerCommand: npm run worker
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: vietfood-db, property: connectionString}
      - key: APP_ENV
        value: demo
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SECURE
        value: "false"
